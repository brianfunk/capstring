<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <script src="/theme-init.js"></script>
  <title>capstring API docs</title>
  <meta name="description" content="OpenAPI reference for the capstring HTTP API: transform text into every style, chain, batch, spell check, count, lorem ipsum, and SVG badges. Try every endpoint in the browser.">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.17.14/swagger-ui.min.css">
  <link rel="stylesheet" href="/site.css">
  <style>
    body { margin: 0; }
    .topbar { display: none; }
    .swagger-ui { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .swagger-ui .info .title small pre { background: var(--accent); }
    .swagger-ui .btn.authorize, .swagger-ui .btn.execute { background: var(--accent); border-color: var(--accent); color: #fff; }

    /* ---- dark theme: Swagger UI ships light only, so recolor every text surface ---- */
    [data-theme="dark"] .swagger-ui,
    [data-theme="dark"] .swagger-ui .info .title,
    [data-theme="dark"] .swagger-ui .info p, [data-theme="dark"] .swagger-ui .info li, [data-theme="dark"] .swagger-ui .info table,
    [data-theme="dark"] .swagger-ui .opblock-tag, [data-theme="dark"] .swagger-ui .opblock-tag small,
    [data-theme="dark"] .swagger-ui .opblock .opblock-summary-path, [data-theme="dark"] .swagger-ui .opblock .opblock-summary-path__deprecated,
    [data-theme="dark"] .swagger-ui .opblock .opblock-summary-description, [data-theme="dark"] .swagger-ui .opblock .opblock-summary-operation-id,
    [data-theme="dark"] .swagger-ui .opblock-description-wrapper p, [data-theme="dark"] .swagger-ui .opblock-external-docs-wrapper p, [data-theme="dark"] .swagger-ui .opblock-title_normal p,
    [data-theme="dark"] .swagger-ui .opblock-section-header h4, [data-theme="dark"] .swagger-ui .opblock-section-header > label,
    [data-theme="dark"] .swagger-ui table thead tr th, [data-theme="dark"] .swagger-ui table thead tr td, [data-theme="dark"] .swagger-ui table tbody tr td,
    [data-theme="dark"] .swagger-ui .parameter__name, [data-theme="dark"] .swagger-ui .parameter__type, [data-theme="dark"] .swagger-ui .parameter__in, [data-theme="dark"] .swagger-ui .parameter__deprecated,
    [data-theme="dark"] .swagger-ui .parameters-col_description p, [data-theme="dark"] .swagger-ui .parameter__extension,
    [data-theme="dark"] .swagger-ui .response-col_status, [data-theme="dark"] .swagger-ui .response-col_description, [data-theme="dark"] .swagger-ui .response-col_links,
    [data-theme="dark"] .swagger-ui .responses-inner h4, [data-theme="dark"] .swagger-ui .responses-inner h5, [data-theme="dark"] .swagger-ui .response-control-media-type__title,
    [data-theme="dark"] .swagger-ui .model-title, [data-theme="dark"] .swagger-ui .model, [data-theme="dark"] .swagger-ui .model-toggle, [data-theme="dark"] .swagger-ui .prop-type, [data-theme="dark"] .swagger-ui .prop-format,
    [data-theme="dark"] .swagger-ui section.models h4, [data-theme="dark"] .swagger-ui section.models h5, [data-theme="dark"] .swagger-ui .models-control,
    [data-theme="dark"] .swagger-ui .tab li, [data-theme="dark"] .swagger-ui label, [data-theme="dark"] .swagger-ui .servers > label,
    [data-theme="dark"] .swagger-ui .markdown p, [data-theme="dark"] .swagger-ui .markdown li, [data-theme="dark"] .swagger-ui .markdown code,
    [data-theme="dark"] .swagger-ui .renderedMarkdown p, [data-theme="dark"] .swagger-ui .renderedMarkdown li, [data-theme="dark"] .swagger-ui .renderedMarkdown code,
    [data-theme="dark"] .swagger-ui .btn, [data-theme="dark"] .swagger-ui select, [data-theme="dark"] .swagger-ui .loading-container .loading::after,
    [data-theme="dark"] .swagger-ui .scheme-container .schemes > label, [data-theme="dark"] .swagger-ui .info .base-url,
    [data-theme="dark"] .swagger-ui .filter .operation-filter-input, [data-theme="dark"] .swagger-ui .download-url-wrapper .select-label,
    [data-theme="dark"] .swagger-ui .microlight, [data-theme="dark"] .swagger-ui .model .property, [data-theme="dark"] .swagger-ui .model .property.primitive { color: #e6e6e6; }

    [data-theme="dark"] .swagger-ui .info a, [data-theme="dark"] .swagger-ui .markdown a, [data-theme="dark"] .swagger-ui .renderedMarkdown a, [data-theme="dark"] .swagger-ui .info .base-url { color: var(--accent); }
    [data-theme="dark"] .swagger-ui .markdown code, [data-theme="dark"] .swagger-ui .renderedMarkdown code, [data-theme="dark"] .swagger-ui .info .title small pre { background: #2a2d35; }
    [data-theme="dark"] .swagger-ui .opblock-section-header, [data-theme="dark"] .swagger-ui .scheme-container, [data-theme="dark"] .swagger-ui section.models, [data-theme="dark"] .swagger-ui section.models .model-container, [data-theme="dark"] .swagger-ui .model-box { background: #1b1e24; }
    [data-theme="dark"] .swagger-ui .opblock .opblock-section-header { box-shadow: none; border-bottom: 1px solid #2c3038; }
    [data-theme="dark"] .swagger-ui input[type=text], [data-theme="dark"] .swagger-ui input[type=search], [data-theme="dark"] .swagger-ui textarea, [data-theme="dark"] .swagger-ui select,
    [data-theme="dark"] .swagger-ui .filter .operation-filter-input { background: #1b1e24; color: #e6e6e6; border-color: #2c3038; }
    [data-theme="dark"] .swagger-ui .parameter__name.required::after, [data-theme="dark"] .swagger-ui .parameter__name.required span { color: #f87171; }
    [data-theme="dark"] .swagger-ui .highlight-code > .microlight, [data-theme="dark"] .swagger-ui .opblock-body pre.microlight, [data-theme="dark"] .swagger-ui .responses-inner pre, [data-theme="dark"] .swagger-ui .model-example pre { background: #0f1115 !important; color: #e6e6e6; }
    [data-theme="dark"] .swagger-ui .copy-to-clipboard { background: #2a2d35; }
    [data-theme="dark"] .swagger-ui .copy-to-clipboard button { background-color: #e6e6e6; }
    [data-theme="dark"] .swagger-ui .opblock-tag { border-bottom-color: #2c3038; }
    [data-theme="dark"] .swagger-ui .opblock .opblock-summary-method { color: #fff; }
    [data-theme="dark"] .swagger-ui .response-control-media-type--accept-controller select, [data-theme="dark"] .swagger-ui .content-type { color: #e6e6e6; }
    [data-theme="dark"] .swagger-ui table.model tr.description td, [data-theme="dark"] .swagger-ui .model .renderedMarkdown p { color: #b4b4b4; }
    [data-theme="dark"] .swagger-ui svg.arrow, [data-theme="dark"] .swagger-ui .expand-operation svg, [data-theme="dark"] .swagger-ui .model-toggle::after { fill: #e6e6e6; filter: invert(1); }
    [data-theme="dark"] .swagger-ui .model-toggle::after { filter: invert(1); }
    [data-theme="dark"] .swagger-ui .opblock.opblock-get .opblock-summary { border-color: #3b82f6; }
    [data-theme="dark"] .swagger-ui .opblock.opblock-post .opblock-summary { border-color: #22c55e; }
  </style>
</head>
<body>
  <div class="site-shell"><header data-site-header></header></div>
  <div id="swagger-ui"></div>
  <div class="site-shell"><footer data-site-footer></footer></div>
  <script src="/site.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.17.14/swagger-ui-bundle.min.js" crossorigin="anonymous"></script>
  <script>
    window.addEventListener('load', () => {
      window.ui = SwaggerUIBundle({
        url: '/openapi.json',
        dom_id: '#swagger-ui',
        deepLinking: true,
        displayRequestDuration: true,
        defaultModelsExpandDepth: 1,
        tryItOutEnabled: true,
        filter: true,
        tagsSorter: 'alpha'
      });
    });
  </script>
</body>
</html>
