<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <script src="/theme-init.js"></script>
  <title>capstring API docs</title>
  <meta name="description" content="OpenAPI reference for the capstring HTTP API: transform text into every style, chain, batch, spell check, count, lorem ipsum, and SVG badges. Try every endpoint in the browser.">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.17.14/swagger-ui.min.css">
  <link rel="stylesheet" href="/site.css">
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; }
    .topbar { display: none; }
    body { background: var(--bg); }
      :root[data-theme="dark"] .swagger-ui, :root[data-theme="dark"] .swagger-ui .info .title, :root[data-theme="dark"] .swagger-ui .info p, :root[data-theme="dark"] .swagger-ui .info li, :root[data-theme="dark"] .swagger-ui .opblock-tag, :root[data-theme="dark"] .swagger-ui .opblock .opblock-summary-description, :root[data-theme="dark"] .swagger-ui .opblock-description-wrapper p, :root[data-theme="dark"] .swagger-ui table thead tr th, :root[data-theme="dark"] .swagger-ui table thead tr td, :root[data-theme="dark"] .swagger-ui .parameter__name, :root[data-theme="dark"] .swagger-ui .parameter__type, :root[data-theme="dark"] .swagger-ui .response-col_status, :root[data-theme="dark"] .swagger-ui .response-col_description, :root[data-theme="dark"] .swagger-ui .model-title, :root[data-theme="dark"] .swagger-ui .model, :root[data-theme="dark"] .swagger-ui .prop-type, :root[data-theme="dark"] .swagger-ui .tab li, :root[data-theme="dark"] .swagger-ui .opblock-section-header h4, :root[data-theme="dark"] .swagger-ui label, :root[data-theme="dark"] .swagger-ui .markdown p, :root[data-theme="dark"] .swagger-ui .markdown code, :root[data-theme="dark"] .swagger-ui .renderedMarkdown p, :root[data-theme="dark"] .swagger-ui .btn, :root[data-theme="dark"] .swagger-ui select, :root[data-theme="dark"] .swagger-ui .parameter__in, :root[data-theme="dark"] .swagger-ui .response-control-media-type__title, :root[data-theme="dark"] .swagger-ui section.models h4 { color: #e6e6e6; }
      :root[data-theme="dark"] .swagger-ui .opblock-section-header { background: #1b1e24; }
      :root[data-theme="dark"] .swagger-ui .scheme-container, :root[data-theme="dark"] .swagger-ui section.models, :root[data-theme="dark"] .swagger-ui .model-box { background: #1b1e24; }
      :root[data-theme="dark"] .swagger-ui input[type=text], :root[data-theme="dark"] .swagger-ui textarea, :root[data-theme="dark"] .swagger-ui select { background: #1b1e24; color: #e6e6e6; border-color: #2c3038; }
      :root[data-theme="dark"] .swagger-ui .markdown code, :root[data-theme="dark"] .swagger-ui .renderedMarkdown code { background: #24272e; }
      :root[data-theme="dark"] .swagger-ui .opblock .opblock-section-header > label { color: #e6e6e6; }
      :root[data-theme="dark"] .swagger-ui .responses-inner h4, :root[data-theme="dark"] .swagger-ui .responses-inner h5 { color: #e6e6e6; }
  </style>
</head>
<body>
  <div class="site-shell"><header data-site-header></header></div>
  <div id="swagger-ui"></div>
  <div class="site-shell"><footer data-site-footer></footer></div>
  <script src="/site.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.17.14/swagger-ui-bundle.min.js" crossorigin="anonymous"></script>
  <script>
    window.addEventListener('load', () => {
      window.ui = SwaggerUIBundle({
        url: '/openapi.json',
        dom_id: '#swagger-ui',
        deepLinking: true,
        displayRequestDuration: true,
        defaultModelsExpandDepth: 1,
        tryItOutEnabled: true,
        filter: true,
        tagsSorter: 'alpha'
      });
    });
  </script>
</body>
</html>
